apiVersion: 1
datasources:
  - name: Temperaturas MongoDB via API
    uid: temperaturas-json
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      allowedHosts:
        - http://api:8000
      customHealthCheckEnabled: true
      customHealthCheckUrl: http://api:8000/health
