# Semana 5 · Configuración de Mosquitto para el laboratorio
# Mosquitto 2 exige declarar los listeners y si se permiten clientes anónimos.

# MQTT estándar
listener 1883
# WebSockets (para dashboards en el navegador)
listener 9001
protocol websockets

# Solo para el laboratorio: cualquier cliente puede conectarse sin usuario.
# En el proyecto se recomienda usuario/contraseña (password_file) o TLS.
allow_anonymous true

# Guarda en disco las sesiones persistentes y los mensajes en cola (QoS 1 y 2)
persistence true
persistence_location /mosquitto/data/

# Registra cada paquete (CONNECT, PUBLISH, PUBACK, SUBSCRIBE...) para observar el flujo
log_dest stdout
log_type all
log_timestamp_format %H:%M:%S
